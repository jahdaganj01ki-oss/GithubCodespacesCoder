name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release signing configuration
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_values=(
            "$ANDROID_KEYSTORE_BASE64"
            "$ANDROID_KEYSTORE_PASSWORD"
            "$ANDROID_KEY_ALIAS"
            "$ANDROID_KEY_PASSWORD"
          )
          configured=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if [[ "$configured" -ne 0 && "$configured" -ne 4 ]]; then
            echo "::error::Configure all four Android signing secrets or leave all four unset."
            exit 1
          fi
          if [[ "$configured" -eq 4 ]]; then
            keystore_path="$RUNNER_TEMP/gitcodera-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
            echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
            echo "Release signing is configured."
          else
            echo "Release signing is not configured; the release APK will be unsigned."
          fi

      - name: Run unit tests, backend tests and Android lint
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
          OAUTH_BACKEND_URL: ${{ vars.OAUTH_BACKEND_URL }}
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :oauth-server:test :oauth-server:installDist

      - name: Build debug and release APKs
        env:
          GITHUB_CLIENT_ID: ${{ vars.GITHUB_CLIENT_ID }}
          OAUTH_BACKEND_URL: ${{ vars.OAUTH_BACKEND_URL }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug :app:assembleRelease

      - name: Build OAuth backend container
        run: docker build --file oauth-server/Dockerfile --tag gitcodera-oauth-server:${{ github.sha }} .

      - name: Upload APK artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GitCoderA-${{ github.sha }}
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            oauth-server/build/distributions/*.tar
